name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Na PR se build jen ověří, nedeployuje se (viz podmínka u kroku Deploy).
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
          VITE_COOKIEYES_ID: ${{ secrets.VITE_COOKIEYES_ID }}
          VITE_GTM_CONTAINER_ID: ${{ secrets.VITE_GTM_CONTAINER_ID }}
        run: npm run build

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
